[project]
name = "realtime-translation"
version = "0.1.0"
description = "Windows desktop live translation app for overseas livestreams."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8.0",
    "qasync>=0.27.1",
    "PyAudioWPatch>=0.2.12.7",
    "httpx>=0.27.2",
    "keyring>=25.5.0",
    "platformdirs>=4.3.6",
    "numpy>=2.1.3",
]

[project.optional-dependencies]
local-asr = [
    "faster-whisper>=1.1.0",
]
dev = [
    "pytest>=8.3.3",
    "pyinstaller>=6.0",
]

[project.scripts]
realtime-translation = "app.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
